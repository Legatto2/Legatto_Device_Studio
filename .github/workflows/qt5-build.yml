name: Qt 5 build and safety tests

on:
  push:
    branches: [main, 'hardening/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qt5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qt5-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record source revision
        run: |
          mkdir -p audit-artifacts
          git rev-parse HEAD > audit-artifacts/revision.txt
          git archive --format=zip HEAD -o audit-artifacts/source-snapshot.zip
      - name: Install Qt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qtbase5-dev libqt5serialport5-dev
          qmake -v | tee audit-artifacts/toolchain.txt
          g++ --version >> audit-artifacts/toolchain.txt
      - name: Compile application without running it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cd build
          qmake ../MotoTool_MTK.pro CONFIG+=debug 'QMAKE_CXXFLAGS+=-Werror=return-type'
          make -j2 2>&1 | tee ../audit-artifacts/build.log
      - name: Run source safety checks when present
        if: ${{ !cancelled() && hashFiles('tests/test_source_safety.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee audit-artifacts/source-tests.log
      - name: Run Qt safety tests when present
        if: ${{ !cancelled() && hashFiles('tests/security_tests.pro') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-tests
          cd build-tests
          qmake ../tests/security_tests.pro CONFIG+=debug 'QMAKE_CXXFLAGS+=-Werror=return-type'
          make -j2 2>&1 | tee ../audit-artifacts/test-build.log
          QT_QPA_PLATFORM=offscreen ./security_tests -txt 2>&1 | tee ../audit-artifacts/qt-tests.log
      - name: Preserve source and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qt5-audit-${{ github.sha }}
          path: audit-artifacts/
          retention-days: 7
          if-no-files-found: error
